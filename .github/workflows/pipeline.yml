name: Pipeline Run

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Run specific stage (extract, enrich, extract-enrich, flora, author, author-randomize, email) or all'
        type: choice
        default: 'all'
        options:
          - all
          - extract-enrich-flora-author
          - extract
          - enrich
          - extract-enrich
          - flora
          - author
          - author-randomize
          - email
      limit:
        description: 'Max preprints per stage (0 = unlimited)'
        default: '0'
      email_limit:
        description: 'Max emails (recipients) to send per run (0 = skip email)'
        default: '0'
      enrich_workers:
        description: 'Parallel workers for Crossref/OpenAlex enrichment'
        default: '6'
      orcid_workers:
        description: 'Parallel workers for ORCID lookups'
        default: '3'
      backlog_depth:
        description: 'How many follow-up runs remain (0 = no re-trigger)'
        default: '5'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      INPUT_STAGE: ${{ github.event_name == 'schedule' && 'extract-enrich-flora-author' || github.event.inputs.stage || inputs.stage || 'all' }}
      INPUT_LIMIT: ${{ github.event.inputs.limit || inputs.limit || '0' }}
      INPUT_EMAIL_LIMIT: ${{ github.event.inputs.email_limit || inputs.email_limit || '0' }}
      INPUT_ENRICH_WORKERS: ${{ github.event.inputs.enrich_workers || inputs.enrich_workers || '6' }}
      INPUT_ORCID_WORKERS: ${{ github.event.inputs.orcid_workers || inputs.orcid_workers || '3' }}
      INPUT_BACKLOG_DEPTH: ${{ github.event.inputs.backlog_depth || inputs.backlog_depth || '5' }}
      PIPELINE_ENV: prod
      PIPELINE_ENABLE_EMAIL_STAGE: 'true'
      DDB_BILLING_MODE: PAY_PER_REQUEST
      DDB_TABLE_PREPRINTS: prod_preprints
      DDB_TABLE_REFERENCES: prod_preprint_references
      DDB_TABLE_TEI: prod_preprint_tei
      DDB_TABLE_SYNCSTATE: prod_sync_state
      DDB_TABLE_EXCLUDED_PREPRINTS: prod_excluded_preprints
      DDB_TABLE_API_CACHE: prod_api_cache
      DDB_TABLE_TRIAL_AUTHOR_NODES: prod_trial_author_nodes
      DDB_TABLE_TRIAL_AUTHOR_TOKENS: prod_trial_author_tokens
      DDB_TABLE_TRIAL_CLUSTERS: prod_trial_clusters
      DDB_TABLE_TRIAL_ASSIGNMENTS: prod_trial_preprint_assignments
      DDB_TABLE_EMAIL_SUPPRESSION: prod_email_suppression
      PDF_DEST_ROOT: /tmp/preprints
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
      OSF_API_TOKEN: ${{ secrets.OSF_API_TOKEN }}
      ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
      ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      TEI_S3_BUCKET: flora-preprint-tei-cache
      GMAIL_SENDER_ADDRESS: flora@replications.forrt.org
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      PIPELINE_NOTIFY_EMAIL: ${{ secrets.PIPELINE_NOTIFY_EMAIL }}

    steps:
      - name: Report run parameters
        run: |
          echo "## Pipeline Run: stage=\`$INPUT_STAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | \`$INPUT_STAGE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Limit | \`$INPUT_LIMIT\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Email limit | \`$INPUT_EMAIL_LIMIT\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Enrich workers | \`$INPUT_ENRICH_WORKERS\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ORCID workers | \`$INPUT_ORCID_WORKERS\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backlog depth | \`$INPUT_BACKLOG_DEPTH\` |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        id: run
        run: |
          STAGE="$INPUT_STAGE"
          LIMIT="$INPUT_LIMIT"
          ENRICH_WORKERS="$INPUT_ENRICH_WORKERS"
          ORCID_WORKERS="$INPUT_ORCID_WORKERS"

          # Convert limit 0 to a large number (effectively unlimited)
          if [ "$LIMIT" = "0" ]; then
            LIMIT="100000"
          fi

          EMAIL_LIMIT="$INPUT_EMAIL_LIMIT"
          # Keep a safety margin below the GH Actions job timeout (330 min)
          # so we can still set backlog output and self-dispatch.
          SOFT_TIMEOUT_SECONDS=18600
          SOFT_DEADLINE_EPOCH=$(( $(date +%s) + SOFT_TIMEOUT_SECONDS ))

          EMAIL_ARGS=""
          if [ "$EMAIL_LIMIT" != "0" ]; then
            EMAIL_ARGS="--include-email --email-limit $EMAIL_LIMIT"
          fi

          if [ "$STAGE" = "all" ]; then
            REMAINING_SECONDS=$(( SOFT_DEADLINE_EPOCH - $(date +%s) ))
            if [ "$REMAINING_SECONDS" -le 0 ]; then
              echo "::warning::No soft-time budget left before stage 'all'; marking backlog for follow-up run."
              printf '%s\n' '{"stages":{"all":{"stage":"all","processed":0,"failed":0,"limit_reached":false,"stopped_due_to_time":true}}}' > /tmp/pipeline_output.json
              RUN_RC=124
            else
            set +e
            timeout --signal=TERM --kill-after=60 \
              "$REMAINING_SECONDS" \
              python -m osf_sync.pipeline run-post-grobid \
                --extract-limit "$LIMIT" \
                --enrich-limit "$LIMIT" \
                --enrich-workers "$ENRICH_WORKERS" \
                --orcid-workers "$ORCID_WORKERS" \
                --max-seconds-per-stage 3600 \
                $EMAIL_ARGS \
                --output-json /tmp/pipeline_output.json
            RUN_RC=$?
            set -e
            fi

            if [ "$RUN_RC" -eq 124 ]; then
              echo "::warning::run-post-grobid hit soft timeout (${SOFT_TIMEOUT_SECONDS}s); marking backlog for follow-up run."
              printf '%s\n' '{"stages":{"all":{"stage":"all","processed":0,"failed":0,"limit_reached":false,"stopped_due_to_time":true}}}' > /tmp/pipeline_output.json
            elif [ "$RUN_RC" -ne 0 ]; then
              exit "$RUN_RC"
            fi
          elif [ "$STAGE" = "extract-enrich-flora-author" ]; then
            REMAINING_SECONDS=$(( SOFT_DEADLINE_EPOCH - $(date +%s) ))
            if [ "$REMAINING_SECONDS" -le 0 ]; then
              echo "::warning::No soft-time budget left before stage 'extract-enrich-flora-author'; marking backlog for follow-up run."
              printf '%s\n' '{"stages":{"extract-enrich-flora-author":{"stage":"extract-enrich-flora-author","processed":0,"failed":0,"limit_reached":false,"stopped_due_to_time":true}}}' > /tmp/pipeline_output.json
              RUN_RC=124
            else
            set +e
            timeout --signal=TERM --kill-after=60 \
              "$REMAINING_SECONDS" \
              python -m osf_sync.pipeline run-post-grobid \
                --extract-limit "$LIMIT" \
                --enrich-limit "$LIMIT" \
                --enrich-workers "$ENRICH_WORKERS" \
                --orcid-workers "$ORCID_WORKERS" \
                --max-seconds-per-stage 3600 \
                --skip-randomization \
                --output-json /tmp/pipeline_output.json
            RUN_RC=$?
            set -e
            fi

            if [ "$RUN_RC" -eq 124 ]; then
              echo "::warning::run-post-grobid (no randomize/email) hit soft timeout (${SOFT_TIMEOUT_SECONDS}s); marking backlog for follow-up run."
              printf '%s\n' '{"stages":{"extract-enrich-flora-author":{"stage":"extract-enrich-flora-author","processed":0,"failed":0,"limit_reached":false,"stopped_due_to_time":true}}}' > /tmp/pipeline_output.json
            elif [ "$RUN_RC" -ne 0 ]; then
              exit "$RUN_RC"
            fi
          elif [ "$STAGE" = "extract-enrich" ]; then
            EXTRACT_TIMED_OUT=0

            REMAINING_SECONDS=$(( SOFT_DEADLINE_EPOCH - $(date +%s) ))
            if [ "$REMAINING_SECONDS" -le 0 ]; then
              RUN_RC=124
            else
              set +e
              timeout --signal=TERM --kill-after=60 \
                "$REMAINING_SECONDS" \
                python -m osf_sync.pipeline run \
                  --stage extract \
                  --limit "$LIMIT" \
                  --max-seconds 18000 \
                  --output-json /tmp/pipeline_output_extract.json
              RUN_RC=$?
              set -e
            fi

            if [ "$RUN_RC" -eq 124 ]; then
              echo "::warning::stage 'extract' hit soft timeout (${SOFT_TIMEOUT_SECONDS}s); marking backlog for follow-up run."
              printf '%s\n' '{"stage":"extract","processed":0,"failed":0,"limit_reached":false,"stopped_due_to_time":true}' > /tmp/pipeline_output_extract.json
              EXTRACT_TIMED_OUT=1
            elif [ "$RUN_RC" -ne 0 ]; then
              exit "$RUN_RC"
            fi

            if [ "$EXTRACT_TIMED_OUT" -eq 0 ]; then
              REMAINING_SECONDS=$(( SOFT_DEADLINE_EPOCH - $(date +%s) ))
              if [ "$REMAINING_SECONDS" -le 0 ]; then
                RUN_RC=124
              else
                set +e
                timeout --signal=TERM --kill-after=60 \
                  "$REMAINING_SECONDS" \
                  python -m osf_sync.pipeline run \
                    --stage enrich \
                    --limit "$LIMIT" \
                    --enrich-workers "$ENRICH_WORKERS" \
                    --max-seconds 18000 \
                    --output-json /tmp/pipeline_output_enrich.json
                RUN_RC=$?
                set -e
              fi

              if [ "$RUN_RC" -eq 124 ]; then
                echo "::warning::stage 'enrich' hit soft timeout (${SOFT_TIMEOUT_SECONDS}s); marking backlog for follow-up run."
                printf '%s\n' '{"stage":"enrich","processed":0,"failed":0,"limit_reached":false,"stopped_due_to_time":true}' > /tmp/pipeline_output_enrich.json
              elif [ "$RUN_RC" -ne 0 ]; then
                exit "$RUN_RC"
              fi
            fi

            cat > /tmp/merge_pipeline_outputs.py <<'PY'
          import json

          def _load(path: str):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}

          extract = _load("/tmp/pipeline_output_extract.json")
          enrich = _load("/tmp/pipeline_output_enrich.json")
          out = {"stages": {}}
          if isinstance(extract, dict):
              if extract.get("stage") == "extract":
                  out["stages"]["extract"] = extract
              elif isinstance(extract.get("stages"), dict):
                  out["stages"]["extract"] = extract["stages"].get("extract", {})
          if isinstance(enrich, dict):
              if enrich.get("stage") == "enrich":
                  out["stages"]["enrich"] = enrich
              elif isinstance(enrich.get("stages"), dict):
                  out["stages"]["enrich"] = enrich["stages"].get("enrich", {})
          with open("/tmp/pipeline_output.json", "w", encoding="utf-8") as f:
              json.dump(out, f)
          print(json.dumps(out, indent=2))
          PY
            python /tmp/merge_pipeline_outputs.py
          else
            EXTRA_ARGS=""
            STAGE_LIMIT="$LIMIT"
            if [ "$STAGE" = "email" ]; then
              STAGE_LIMIT="$EMAIL_LIMIT"
              # Spread emails: 45 min per 10 messages = 270s per message
              SPREAD=$(( STAGE_LIMIT * 270 ))
              EXTRA_ARGS="--spread-seconds $SPREAD"
            fi
            REMAINING_SECONDS=$(( SOFT_DEADLINE_EPOCH - $(date +%s) ))
            if [ "$REMAINING_SECONDS" -le 0 ]; then
              RUN_RC=124
            else
              set +e
              timeout --signal=TERM --kill-after=60 \
                "$REMAINING_SECONDS" \
                python -m osf_sync.pipeline run \
                  --stage "$STAGE" \
                  --limit "$STAGE_LIMIT" \
                  --enrich-workers "$ENRICH_WORKERS" \
                  --orcid-workers "$ORCID_WORKERS" \
                  --max-seconds 18000 \
                  $EXTRA_ARGS \
                  --output-json /tmp/pipeline_output.json
              RUN_RC=$?
              set -e
            fi

            if [ "$RUN_RC" -eq 124 ]; then
              echo "::warning::stage '$STAGE' hit soft timeout (${SOFT_TIMEOUT_SECONDS}s); marking backlog for follow-up run."
              printf '{"stage":"%s","processed":0,"failed":0,"limit_reached":false,"stopped_due_to_time":true}\n' "$STAGE" > /tmp/pipeline_output.json
            elif [ "$RUN_RC" -ne 0 ]; then
              exit "$RUN_RC"
            fi
          fi

          cat > /tmp/has_pipeline_backlog.py <<'PY'
          import json
          import sys

          try:
              with open("/tmp/pipeline_output.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              sys.exit(1)

          stages = data.get("stages")
          if isinstance(stages, dict):
              has_backlog = any(
                  bool(s.get("stopped_due_to_time")) or bool(s.get("limit_reached"))
                  for s in stages.values()
                  if isinstance(s, dict)
              )
          else:
              has_backlog = bool(data.get("stopped_due_to_time")) or bool(data.get("limit_reached"))

          sys.exit(0 if has_backlog else 1)
          PY

          # Re-trigger only on explicit backlog signals.
          if python /tmp/has_pipeline_backlog.py; then
            echo "has_backlog=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backlog=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-trigger if backlog remains
        if: steps.run.outputs.has_backlog == 'true' && env.INPUT_BACKLOG_DEPTH != '0'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WORKFLOW_DISPATCH_TOKEN secret not set - cannot re-trigger. Set a PAT with 'actions:write' scope."
            exit 0
          fi
          CURRENT_DEPTH="$INPUT_BACKLOG_DEPTH"
          NEXT_DEPTH=$((CURRENT_DEPTH - 1))
          if [ "$NEXT_DEPTH" -gt 0 ]; then
            echo "Backlog detected, re-triggering with depth=$NEXT_DEPTH"
            gh workflow run pipeline.yml \
              --ref "${{ github.ref_name }}" \
              -f stage="$INPUT_STAGE" \
              -f limit="$INPUT_LIMIT" \
              -f email_limit="$INPUT_EMAIL_LIMIT" \
              -f enrich_workers="$INPUT_ENRICH_WORKERS" \
              -f orcid_workers="$INPUT_ORCID_WORKERS" \
              -f backlog_depth="$NEXT_DEPTH"
          else
            echo "Backlog depth exhausted, not re-triggering"
          fi
