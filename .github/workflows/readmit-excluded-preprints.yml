name: Readmit Excluded Preprints

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, no updates)'
        type: boolean
        default: true
      limit:
        description: 'Max preprints to readmit (0 = all)'
        default: '0'

jobs:
  readmit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DDB_TABLE_PREPRINTS: prod_preprints
      DDB_TABLE_EXCLUDED_PREPRINTS: prod_excluded_preprints
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run readmission
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            ARGS="--commit"
          fi

          LIMIT="${{ inputs.limit }}"
          if [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi

          python scripts/readmit_excluded_preprints.py $ARGS
