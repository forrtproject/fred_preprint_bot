name: Temporary encrypted secret recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-22.04
    steps:
      - name: Encrypt GMAIL_APP_PASSWORD for local recovery
        env:
          TARGET_SECRET: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECOVERY_PUBLIC_KEY: ${{ secrets.RECOVERY_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$RECOVERY_PUBLIC_KEY" > public_key.pem
          printf '%s' "$TARGET_SECRET" | openssl pkeyutl \
            -encrypt -pubin -inkey public_key.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            | base64 -w0 > encrypted_secret.txt
          echo '--- ENCRYPTED BLOB START ---'
          cat encrypted_secret.txt
          echo
          echo '--- ENCRYPTED BLOB END ---'