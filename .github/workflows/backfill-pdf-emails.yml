name: Backfill PDF Emails

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, no updates)'
        type: boolean
        default: true
      limit:
        description: 'Max preprints to process (0 = all)'
        default: '0'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      DDB_TABLE_PREPRINTS: prod_preprints
      PDF_DEST_ROOT: /tmp/preprints
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      OSF_API_TOKEN: ${{ secrets.OSF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          else
            ARGS="--no-dry-run"
          fi

          LIMIT="${{ inputs.limit }}"
          if [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi

          python scripts/backfill_pdf_emails.py $ARGS
