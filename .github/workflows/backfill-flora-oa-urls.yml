name: Backfill FLoRA OA URLs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max refs to process (0 = unlimited)'
        default: '0'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DDB_TABLE_REFS: prod_refs
      DDB_TABLE_PREPRINTS: prod_preprints
      DDB_TABLE_SYNC: prod_sync
      DDB_TABLE_EXCLUDED_PREPRINTS: prod_excluded_preprints
      DDB_TABLE_TEI: prod_tei
      DDB_TABLE_API_CACHE: prod_api_cache
      DDB_TABLE_TRIAL_ASSIGNMENTS: prod_trial_assignments
      DDB_TABLE_TRIAL_CLUSTERS: prod_trial_clusters
      DDB_TABLE_TRIAL_NODES: prod_trial_nodes
      DDB_TABLE_TRIAL_TOKENS: prod_trial_tokens
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Re-run FLoRA lookup to backfill oa_url_r
        run: |
          ARGS="--no-only-unchecked"
          LIMIT="${{ inputs.limit }}"
          if [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          python -m osf_sync.augmentation.flora_original_lookup $ARGS
